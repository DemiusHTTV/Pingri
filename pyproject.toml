[project]
name = "pingri"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dmitriy", email = "babygreenyoda@yandex.ru" }
]
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.31.0",
    "fastapi>=0.115.0",
]

[project.optional-dependencies]
bot = [
    "aiogram>=3.31.0",
    "pydantic-settings>=2.15.0",
]
database = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "sqlalchemy[asyncio]>=2.0",
]

[project.scripts]
pingri = "pingri.cli:run"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
